[package]
name = "steric_x"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance steric featurization and reaction selectivity prediction"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AndrejRumenovski/StericX"
authors = ["Andrej Rumenovski"]
keywords = ["chemistry", "cheminformatics", "sterimol", "buried-volume", "descriptors"]
categories = ["science", "command-line-utilities"]

[[bin]]
name = "stericx"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
glam = "0.30"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
