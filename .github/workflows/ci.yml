name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Install locked Python environment
        uses: astral-sh/setup-uv@v6

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Check support-script syntax
        run: |
          uv run python -m py_compile \
            scripts/prepare_data.py \
            scripts/prepare_quantum_data.py \
            scripts/freeze_prospective_deck.py \
            scripts/stericx_quantum.py \
            scripts/validate_stericx.py \
            studies/study_001_ni_hda.py \
            studies/study_002_buried_volume.py \
            studies/study_003_quantum_geometry.py \
            studies/study_004_reproduction.py \
            studies/study_004_scaled.py \
            studies/study_004_vbur_family.py \
            studies/study_004_sterimol.py \
            studies/study_004_frame_residual.py \
            studies/study_005_pyramidalization.py \
            studies/study_006_residual_localization.py \
            studies/study_007_crosscoupling.py \
            studies/study_008_speed_benchmark.py
          bash -n benchmark_linux.sh install_quantum_tools.sh

      - name: Lint and format-check Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test quantum parsers without external executables
        run: uv run python -m unittest tests/test_quantum_backend.py
